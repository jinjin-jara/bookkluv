name: Supabase 깨우기

# 무료 요금제는 한동안 요청이 없으면 프로젝트를 재운다.
# 사흘에 한 번으로는 못 막아서(2026-09-10 잠듦) 날마다 두 번 두드린다.
on:
  schedule:
    - cron: '17 3 * * *'    # 날마다 03:17 UTC
    - cron: '17 15 * * *'   # 날마다 15:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 회차 하나만 읽어 본다
        run: |
          # curl이 죽어도 스크립트가 여기서 끝나지 않게 한다.
          # 프로젝트가 잠들면 호스트 이름부터 사라져(exit 6) 아무 말 없이 끝나 버린다.
          code=$(curl -s --max-time 20 --retry 2 --retry-delay 5 \
            -o /tmp/out.txt -w '%{http_code}' \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/meetings?select=id&limit=1") || curl_exit=$?

          echo "HTTP ${code:-none} (curl ${curl_exit:-0})"
          head -c 200 /tmp/out.txt || true

          if [ "${curl_exit:-0}" = "6" ]; then
            echo "::error::호스트를 찾지 못했다. Supabase가 이미 잠들었을 가능성이 크다."
            exit 1
          fi

          if [ "$code" != "200" ]; then
            echo "::error::Supabase가 응답하지 않는다 (HTTP ${code:-none})"
            exit 1
          fi
