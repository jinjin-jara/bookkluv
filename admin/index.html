<body>
<div class="wrap">
  <header>
    <a class="site-head" href="./">
      <img src="assets/mascot.png" alt="">
      <div>
        <h1>북끄럽</h1>
        <p>독서모임 아카이브</p>
      </div>
    </a>
  </header>

  <div class="page-title">
    <h2>모임지 등록</h2>
    <p>줄글을 붙여넣으면 질문으로 나눠드려요</p>
  </div>

  <form class="form" id="admin-form">
    <div class="field-row">
      <label class="field">
        <span>모임 날짜</span>
        <input type="date" id="f-date" required>
      </label>
      <label class="field">
        <span>선정자 <em>화면엔 홍*동으로 나와요</em></span>
        <input type="text" id="f-picker" placeholder="홍길동" maxlength="20">
      </label>
    </div>

    <label class="field is-search">
      <span>책 제목</span>
      <span class="with-btn">
        <input type="text" id="f-title" placeholder="책 제목을 적으면 찾아드려요" autocomplete="off" required>
        <button type="button" id="f-search">책 검색</button>
      </span>
      <div class="search-results" id="f-results" hidden></div>
    </label>

    <div class="field-row">
      <label class="field">
        <span>저자</span>
        <input type="text" id="f-author" placeholder="목정원">
      </label>
      <label class="field">
        <span>쪽수 <em>비워두면 기본 두께</em></span>
        <input type="number" id="f-pages" placeholder="348" min="1" max="9999">
      </label>
    </div>


    <label class="field">
      <span>이야깃거리 <em>Q1. / 1) / Q. 같은 머리표를 알아서 찾아요</em></span>
      <textarea id="f-raw" rows="9" placeholder="줄글을 그대로 붙여넣으면 질문 단위로 나눠드려요"></textarea>
    </label>

    <div id="f-preview"></div>


    <div class="form-actions">
      <button type="submit" class="primary" id="f-submit">모임지 등록</button>
    </div>

    <p class="form-msg" id="f-msg" hidden></p>
  </form>
</div>
